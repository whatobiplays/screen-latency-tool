[platformio]
default_envs = teensy41
src_dir = src
test_dir = tests
include_dir = include

[env:teensy41]
platform = teensy@6.0.0
board = teensy41
framework = arduino
board_build.f_cpu = 600000000L
build_flags =
  -DUSB_SLT_FIXTURE
  -DUSB_HID
  -Iinclude
extra_scripts =
  pre:scripts/apply_core_overlay.py
  pre:scripts/capture_link_map.py
build_unflags = -DUSB_SERIAL

[env:teensy41-flexpwm1-candidate]
extends = env:teensy41
build_flags =
  ${env:teensy41.build_flags}
  -DSLT_ENABLE_FLEXPWM1_CAPTURE=1

