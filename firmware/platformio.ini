[platformio]
default_envs = teensy41
src_dir = src
test_dir = tests
include_dir = include

[env:teensy41]
platform = teensy@6.0.0
board = teensy41
framework = arduino
board_build.f_cpu = 600000000L
build_flags =
  -DUSB_SLT_FIXTURE
  -DUSB_HID
  -Iinclude
extra_scripts =
  pre:scripts/apply_core_overlay.py
  pre:scripts/capture_link_map.py
build_unflags = -DUSB_SERIAL

[env:teensy41-flexpwm1-candidate]
extends = env:teensy41
build_flags =
  ${env:teensy41.build_flags}
  -DSLT_ENABLE_FLEXPWM1_CAPTURE=1

; Optional steady LED load for supervised S3b. The default image drives no
; external LED. Pin 2 is reserved for the reviewed 1 kOhm/WP7113ID branch.
[env:teensy41-bench]
extends = env:teensy41
build_flags =
  ${env:teensy41.build_flags}
  -DSLT_BENCH_LED_LOAD=1

