<text x="30" y="235">Soldered FR4 carrier; supported sockets; insulated module underside and all four XT30 solder cups.</text>
<text x="30" y="263">L721A and GST18U05-P1J NOT FITTED. No parallel input. No breadboard USB data or optical TIA.</text>
