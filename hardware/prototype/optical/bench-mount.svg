<text x="560" y="590" class="">C. Optical section, projection d measured from component face</text>
<text x="560" y="620" class="small">PCB front d=0; glass d=45; shroud d=12 to 30.</text>
<text x="560" y="647" class="small">Shroud top ID16 / OD20; tip ID34 / OD38; wall2.</text>
<text x="560" y="674" class="small">D1 body maximum d=9.4 with base stand-off ≤0.5.</text>
<text x="560" y="701" class="small">Keep top rim ≥2.3 from maximum body after length tolerance.</text>
<text x="560" y="728" class="small">Axis offset ≤1; optical tilt ≤6°; carrier/glass tilt ≤3°.</text>
<text x="560" y="755" class="small">Cone screen: r(d)=0.707+1+d tan20°+d tan6°.</text>
<text x="560" y="782" class="small">Inner-radius tolerance -0.3 leaves positive margins:</text>
<text x="560" y="809" class="small">d12: 0.364; d30: 0.921 (mm).</text>
<text x="560" y="836" class="small">45° beam rotation needs 212.2 square print-bed space.</text>
<text x="560" y="863" class="small">Printed load-bearing sections solid; E=500 assumed.</text>
<text x="560" y="890" class="small">10N vertical / 1N lateral; computed approach 1.005.</text>
<text x="560" y="917" class="small">Whole-fixture angle allowance 4.0; U2 lower bound 6.45; reserve 2.</text>
<text x="560" y="944" class="small">Orange lips: x0..1 /49..50, y24..28 /40..44.</text>
<text x="560" y="971" class="small">No PCB drilling. Backside patches include masked GND.</text>
<text x="560" y="998" class="small">DUT active-area offsets and manufactured fit unmeasured.</text>
<text x="560" y="1025" class="small">U2 indicated minimum: static 10.3; all movements exercised 4.0.</text>
